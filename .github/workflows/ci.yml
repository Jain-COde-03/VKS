name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: 18
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend lint
        run: npm exec eslint . || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: 18
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
